<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Happy Birthday Karena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <section id="gate" class="gate">
      <p class="gate-kicker">A little something, just for you</p>
      <div class="envelope" aria-hidden="true">
        <div class="envelope-flap"></div>
        <div class="envelope-body">
          <span class="seal">K</span>
        </div>
      </div>
      <h1 class="gate-title">For Karena</h1>
      <p class="gate-copy">Tap to open your birthday</p>
      <button id="open-card" class="open-btn" type="button">Open</button>
    </section>

    <main id="card" class="card" hidden>
      <button id="music-toggle" class="music-btn" type="button" aria-label="Pause music">
        <span class="music-icon" aria-hidden="true"></span>
        <span id="music-label">Playing</span>
      </button>

      <header class="hero">
        <p class="eyebrow">with all my heart</p>
        <h1 class="script">Happy Birthday</h1>
        <p class="name">Karena</p>
        <div class="cake" aria-hidden="true">
          <div class="flame"></div>
          <div class="candle"></div>
          <div class="frosting"></div>
          <div class="layer"></div>
        </div>
        <p class="note">
          Today is yours. Here is a song, just for you.
        </p>
        <p id="lyrics" class="lyrics" aria-live="polite">Happy birthday to you</p>
      </header>

      <section id="memories" class="memories" aria-labelledby="memories-title" hidden>
        <h2 id="memories-title">Our time together</h2>
        <div id="gallery" class="gallery"></div>
      </section>

      <footer class="footer">
        <p>Happy birthday, Karena. I am so glad we have these days.</p>
      </footer>
    </main>

    <div id="lightbox" class="lightbox" hidden>
      <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close photo">
        Close
      </button>
      <img id="lightbox-image" alt="" />
      <p id="lightbox-caption"></p>
    </div>

    <script src="photos.js"></script>
    <script src="app.js"></script>
  </body>
</html>
